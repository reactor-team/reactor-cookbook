name: Model weights rules
on:
  pull_request:
    paths: ['models/**', 'scripts/**', '.github/workflows/models.yml']
  push:
    branches: [main]
    paths: ['models/**', 'scripts/**', '.github/workflows/models.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  weights:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Test the check
        run: uv run --no-project --with pyyaml --with pytest python -m pytest scripts/tests -q
      - name: Check every model (GUIDELINES.md, Weights and startup)
        run: uv run --no-project --with pyyaml python scripts/check_model_weights.py
