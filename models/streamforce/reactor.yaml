$schema: reactor/v2

model:
  name: streamforce
  version: v0.1.0
  description: |
    Image-to-video under a physical force you change while it plays: a point push or a wind
    field, 480x832, 12 frames per chunk, up to 4089 frames per run.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "4"
      limit: "16"
    memory:
      request: 64Gi
      limit: 160Gi

runtime:
  import: streamforce:StreamForce
  config: streamforce.yaml
  weights_path: ~/.cache/reactor_registry/streamforce
  recording:
    enabled: true
    chunk_seconds: 4
    clip_max_seconds: 300
    video_track: main_video
    video:
      codec: h264
      preset: veryfast
      crf: 23

build:
  runtime_version: "3.11.0"
  python_requirements: requirements.txt
  python_version: "3.12"
  cuda_version: "12.8.1"
  python_indexes:
    - https://download.pytorch.org/whl/cu128
    - https://pypi.org/simple
  build_env:
    UV_INDEX_STRATEGY: unsafe-best-match
    # FlashAttention 2 kernels for Hopper (H100/H200) and Blackwell (B200).
    FLASH_ATTN_CUDA_ARCHS: "90;100"
    TORCH_CUDA_ARCH_LIST: "9.0;10.0"
    MAX_JOBS: "32"
  run:
    - pip install --no-cache-dir --no-build-isolation flash-attn==2.8.3
  system_packages:
    - build-essential
    - ffmpeg
    - git
  runtime_env:
    TOKENIZERS_PARALLELISM: "false"
