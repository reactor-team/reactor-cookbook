$schema: reactor/v1

model:
  name: yume-1-5
  version: v0.1.0
  description: |
    Explore a continuous YUME-1.5 world from text or an uploaded first frame,
    using its released prompt-encoded keyboard and camera controls.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "8"
      limit: "16"
    memory:
      request: 64Gi
      limit: 160Gi

runtime:
  import: yume:Yume15
  config: yume.yaml
  # Source, checkpoints, downloads, uploads, and compiled kernels stay here.
  weights_path: ~/.cache/reactor_registry/yume-1-5
  recording:
    enabled: true
    chunk_seconds: 1.208333
    clip_max_seconds: 300
    video_track: main_video
    video:
      codec: h264
      preset: veryfast
      crf: 23

build:
  runtime_version: "3.2.5"
  python_requirements: requirements.txt
  python_version: "3.12"
  cuda_version: "12.8.1"
  system_packages:
    - build-essential
    - ffmpeg
    - git
    - libgl1
    - libglib2.0-0
  runtime_env:
    PYTORCH_ALLOC_CONF: expandable_segments:True
