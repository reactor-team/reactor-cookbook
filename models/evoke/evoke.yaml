inference:
  seed: 42
  reference_seconds: 5.0
  # A scene-neutral positive condition for omitted prompts. The distilled model
  # runs CFG-free, so negative prompts do not affect exposure or color.
  stability_prompt: >-
    The input scene continues faithfully with balanced exposure, preserved
    highlight and shadow detail, stable brightness, consistent color,
    consistent lighting, and smooth temporal continuity.

stream:
  # Reset only the rollout state after 2048 chunks; loaded weights stay resident.
  max_chunks: 2048

motion:
  # Full-scale rates follow the released pose-track envelope: at most 1.5
  # translation units and 9 degrees over one 1.5-second native chunk.
  translation_units_per_second: 1.0
  rotation_degrees_per_second: 6.0
