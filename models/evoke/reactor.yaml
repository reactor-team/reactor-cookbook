# Reactor model specification for the EVOKE recipe.
$schema: reactor/v1

model:
  name: evoke-post-distillation
  version: v0.1.0
  description: |
    Explore an autoregressive world through text, media, and six-axis camera motion.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "4"
      limit: "8"
    memory:
      request: 8Gi
      limit: 128Gi

runtime:
  import: evoke:Evoke
  config: evoke.yaml
  # Source, the Python 3.10 worker, model snapshots, and compiler caches stay here.
  weights_path: ~/.cache/reactor_registry/evoke
  recording:
    enabled: true
    chunk_seconds: 6
    clip_max_seconds: 300
    video_track: main_video
    video:
      codec: h264
      preset: veryfast
      crf: 23

build:
  runtime_version: "3.2.5"
  python_requirements: requirements.txt
  # EVOKE's v2v reader links to the X11/audio libraries bundled by these Debian
  # runtime packages.
  system_packages:
    - ffmpeg
    - git
    - libx11-6
    - libxau6
    - libxcb1
    - libxdmcp6
    - libxext6
