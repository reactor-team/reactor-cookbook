# Reactor model spec for the RLDX-1 recipe.
$schema: reactor/v1

model:
  name: rldx-1
  version: v0.0.1
  description: |
    Serve RLDX-1 as a three-camera vision-language-action policy. The model
    aligns views and robot state by capture time and streams action chunks.

  # New models register private by default. Uncomment this only if you intend
  # to make your own registered model visible to every Reactor account.
  # public: false

  resources:
    # This image compiles FlashAttention for Blackwell and is configured for a
    # B200. Use a compatible accelerator if you change the build.
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "2"
      limit: "6"
    memory:
      request: 8Gi
      limit: 32Gi

runtime:
  import: pipeline:RLDXPipeline
  config: config.yml
  weights_path: ~/.cache/reactor_registry/rldx-1

build:
  # Per-frame capture metadata used by the alignment logic requires 3.2.2+.
  runtime_version: "3.2.2"
