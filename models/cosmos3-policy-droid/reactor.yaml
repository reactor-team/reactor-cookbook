$schema: reactor/v1

model:
  name: cosmos3-policy-droid
  version: v0.1.0
  description: |
    NVIDIA Cosmos3 DROID robot policy: three camera views and proprioception in,
    a 32-step joint-position action chunk out. Serves the Edge checkpoint by
    default; Nano is a config change.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "2"
      limit: "6"
    memory:
      request: 8Gi
      limit: 32Gi

runtime:
  import: cosmos3_policy_droid:Cosmos3PolicyDroid
  config: cosmos3_policy_droid.yaml
  weights_path: ~/.cache/reactor_registry/cosmos3-policy-droid

build:
  runtime_version: "3.5.0"
  python_requirements: requirements.txt
  cuda_version: "12.8.1"
  # The prebuilt attention kernels below exist for CPython 3.13 only.
  python_version: "3.13"
  # megatron-core is resolved from a git revision (see requirements.txt).
  system_packages:
    - git
  python_indexes:
    # flash-attn, flash-attn-3-nv, and natten wheels built against the pinned
    # torch. The index carries only kernel packages, so it can sit first.
    - https://nvidia-cosmos.github.io/cosmos-dependencies/v1.5.0
  build_env:
    # The PyTorch index also publishes a few common packages at old versions
    # (setuptools, pillow, ...). uv's default takes a package from the first
    # index that has it, which strands the build requirements of the git
    # dependency; considering every index lets each pin resolve where it exists.
    UV_INDEX_STRATEGY: unsafe-best-match
  runtime_env:
    # Keeps the vendored framework's training-only imports off the serving path.
    COSMOS_TRAINING: "0"
    # A large host otherwise spawns one OpenMP thread per core and throttles
    # under the CPU limit.
    OMP_NUM_THREADS: "4"
    MKL_NUM_THREADS: "4"
    HF_HUB_DISABLE_TELEMETRY: "1"
