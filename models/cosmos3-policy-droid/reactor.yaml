$schema: reactor/v2

model:
  name: cosmos3-policy-droid
  version: v0.2.0
  description: |
    NVIDIA Cosmos3 DROID robot policy: three camera views and proprioception in,
    a 32-step joint-position action chunk out. Serves the Edge checkpoint by
    default; Nano is a config change.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "2"
      limit: "6"
    memory:
      request: 8Gi
      limit: 32Gi

runtime:
  import: cosmos3_policy_droid:Cosmos3PolicyDroid
  config: cosmos3_policy_droid.yaml
  # Built by prepare_weights.py; deploy with `--weights ./weights`.
  weights_path: ./weights

build:
  runtime_version: "3.5.0"
  python_requirements: requirements.txt
  cuda_version: "12.8.1"
  # The prebuilt attention kernels below exist for CPython 3.13 only.
  python_version: "3.13"
  # git fetches the pinned upstream source and the megatron-core dependency
  # (see requirements.txt) at build, and reads the checkout's revision at load.
  system_packages:
    - git
  python_indexes:
    # flash-attn, flash-attn-3-nv, and natten wheels built against the pinned
    # torch. The index carries only kernel packages, so it can sit first.
    - https://nvidia-cosmos.github.io/cosmos-dependencies/v1.5.0
  build_env:
    # The PyTorch index also publishes a few common packages at old versions
    # (setuptools, pillow, ...). uv's default takes a package from the first
    # index that has it, which strands the build requirements of the git
    # dependency; considering every index lets each pin resolve where it exists.
    UV_INDEX_STRATEGY: unsafe-best-match
  runtime_env:
    # Keeps the upstream framework's training-only imports off the serving path.
    COSMOS_TRAINING: "0"
    # A large host otherwise spawns one OpenMP thread per core and throttles
    # under the CPU limit.
    OMP_NUM_THREADS: "4"
    MKL_NUM_THREADS: "4"
    HF_HUB_DISABLE_TELEMETRY: "1"
    # Every checkpoint is read from the weights folder. Upstream's own
    # downloader runs the `hf` CLI through `uv`; with both offline, a stray
    # lookup fails at once instead of downloading.
    HF_HUB_OFFLINE: "1"
    UV_OFFLINE: "1"
  run:
    # The upstream serving code, at the revision cosmos3_policy_droid.yaml pins.
    - >-
      git init /opt/cosmos-framework
      && git -C /opt/cosmos-framework fetch --depth 1
      https://github.com/NVIDIA/cosmos-framework.git
      cf5d68c00d97ccd2480a2320ed652b92dec63102
      && git -C /opt/cosmos-framework checkout --detach FETCH_HEAD
