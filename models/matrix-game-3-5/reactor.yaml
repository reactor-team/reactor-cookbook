# Reactor model specification for the Matrix-Game-3.5 recipe.
$schema: reactor/v1

model:
  name: matrix-game-3-5-distilled-first-person
  version: v0.1.0
  description: |
    Explore an autoregressive world from an image, a prompt, and six-axis camera motion.
  # Matrix needs roughly 40 GB of VRAM at 704x1280; the 5B model, its rolling
  # KV cache, and Patch Memory stay resident for the life of the session.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "4"
      limit: "8"
    memory:
      request: 8Gi
      limit: 64Gi

runtime:
  import: matrix_game_3_5:MatrixGame35
  config: matrix_game_3_5.yaml
  # Source, checkpoints, the isolated worker, and download caches stay here.
  weights_path: ~/.cache/reactor_registry/matrix-game-3-5
  recording:
    enabled: true
    chunk_seconds: 4
    clip_max_seconds: 300
    video_track: main_video
    video:
      codec: h264
      preset: veryfast
      crf: 23

build:
  runtime_version: "3.2.5"
  python_requirements: requirements.txt
  cuda_version: "12.8.1"
  python_version: "3.12"
  system_packages:
    - build-essential
    - ffmpeg
    - git
    - libgl1
    - libglib2.0-0
  runtime_env:
    PYTORCH_ALLOC_CONF: expandable_segments:True
