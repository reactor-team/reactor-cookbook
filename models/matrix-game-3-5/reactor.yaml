# Reactor model specification for the Matrix-Game-3.5 recipe.
$schema: reactor/v2

model:
  name: matrix-game-3-5-distilled-first-person
  version: v0.3.0
  description: |
    Explore an autoregressive world from an image, a prompt, and six-axis camera motion.
  # Matrix needs roughly 40 GB of VRAM at 704x1280; the 5B model, its rolling
  # KV cache, and Patch Memory stay resident for the life of the session.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "4"
      limit: "8"
    memory:
      request: 8Gi
      limit: 64Gi

runtime:
  import: matrix_game_3_5:MatrixGame35
  config: matrix_game_3_5.yaml
  # The folder that prepare_weights.py builds. Nothing downloads at runtime.
  weights_path: ./weights
  recording:
    enabled: true
    chunk_seconds: 4
    clip_max_seconds: 300
    video_track: main_video
    video:
      codec: h264
      preset: veryfast
      crf: 23

build:
  runtime_version: "3.10.0"
  python_requirements: requirements.txt
  cuda_version: "12.8.1"
  python_version: "3.12"
  system_packages:
    - build-essential
    - ca-certificates
    - ffmpeg
    - git
    - libgl1
    - libglib2.0-0
  runtime_env:
    HF_HUB_OFFLINE: "1"
    PYTORCH_ALLOC_CONF: expandable_segments:True
  run:
    - pip install --no-cache-dir uv==0.11.19
    - >-
      git init /opt/Matrix-Game-3.5
      && git -C /opt/Matrix-Game-3.5 fetch --depth 1
      https://github.com/Riemann-Dynamics/Matrix-Game-3.5.git
      fa6d2b628ac9b0f1657dc24689536d74bfeb51da
      && git -C /opt/Matrix-Game-3.5 checkout --detach FETCH_HEAD
    # The worker runs Matrix-Game-3.5 in its own Python 3.10 environment:
    # torch 2.10.0 on CUDA 12.8, then the upstream requirements.
    - >-
      export UV_CACHE_DIR=/tmp/matrix-uv UV_PYTHON_INSTALL_DIR=/opt/matrix-python
      && uv venv --python 3.10 /opt/Matrix-Game-3.5/.venv
      && uv pip install --python /opt/Matrix-Game-3.5/.venv/bin/python
      torch==2.10.0 torchvision==0.25.0
      --index-url https://download.pytorch.org/whl/cu128
      && uv pip install --python /opt/Matrix-Game-3.5/.venv/bin/python
      --requirement /opt/Matrix-Game-3.5/requirements.txt ftfy==6.3.1
      && rm -rf /tmp/matrix-uv
