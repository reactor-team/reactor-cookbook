$schema: reactor/v2

model:
  name: abot-world
  version: v0.2.0
  description: |
    Play the distilled ABot-World model with uploaded images, prompts, and native keyboard controls.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "4"
      limit: "8"
    memory:
      request: 8Gi
      limit: 32Gi

runtime:
  import: abot_world:ABotWorld
  config: abot_world.yaml
  # abot_world.yaml's checkpoint section pins the same repository and revision.
  weights_path: hf://acvlab/ABot-World-0-5B-LF@d26a3003701e70d38cd17e2af2faf63bd4ff7632
  recording:
    enabled: true
    chunk_seconds: 4
    clip_max_seconds: 300
    video_track: main_video
    video:
      codec: h264
      preset: veryfast
      crf: 23

build:
  runtime_version: "3.10.0"
  python_requirements: requirements.txt
  cuda_version: "12.8.1"
  python_version: "3.12"
  system_packages:
    - ffmpeg
    - git
  runtime_env:
    # The checkpoint comes from the weight set; nothing downloads at runtime.
    HF_HUB_OFFLINE: "1"
  # Pin the upstream source that abot_world.yaml's source.path names.
  run:
    - >-
      git init /opt/ABot-World
      && git -C /opt/ABot-World fetch --depth 1
      https://github.com/amap-cvlab/ABot-World.git
      604a09c4b135c08af684cadbba0a53efeb119e6d
      && git -C /opt/ABot-World checkout --detach FETCH_HEAD
