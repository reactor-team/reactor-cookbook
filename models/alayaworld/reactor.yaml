# Reactor model specification for the AlayaWorld recipe.
$schema: reactor/v1

model:
  name: alaya-world
  version: v0.1.0
  description: |
    Play the distilled AlayaWorld model with live prompt and six-axis camera controls.
  resources:
    # FlashAttention-4 needs a Hopper or Blackwell accelerator.
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "4"
      limit: "8"
    # The checkpoint, Gemma-3-12B, Depth-Anything-3, and TAEHV stage through host RAM.
    memory:
      request: 8Gi
      limit: 96Gi

runtime:
  import: alayaworld:AlayaWorld
  config: alayaworld.yaml
  # Source checkouts, checkpoints, and downloads stay here.
  weights_path: ~/.cache/reactor_registry/alayaworld
  recording:
    enabled: true
    chunk_seconds: 4
    clip_max_seconds: 300
    video_track: main_video
    video:
      codec: h264
      preset: veryfast
      crf: 23

build:
  runtime_version: "3.2.5"
  python_requirements: requirements.txt
  cuda_version: "12.8.1"
  python_version: "3.12"
  system_packages:
    - git
    - build-essential
  runtime_env:
    PYTORCH_ALLOC_CONF: expandable_segments:True
  # Install FlashAttention 4 with CuTe, then restore Runtime's protobuf wire version.
  run:
    - pip install --no-cache-dir "flash-attn-4==4.0.0b26"
    - pip install --no-cache-dir --no-deps "protobuf==7.35.1"
