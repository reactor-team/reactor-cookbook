# Reactor model specification for the AlayaWorld recipe.
$schema: reactor/v1

model:
  name: alaya-world
  version: v0.1.3
  description: |
    Play the distilled AlayaWorld model with live prompt and six-axis camera controls.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "4"
      limit: "8"
    # The checkpoint, Gemma-3-12B, and Depth-Anything-3 stage through host RAM.
    memory:
      request: 8Gi
      limit: 96Gi

runtime:
  import: alayaworld:AlayaWorld
  config: alayaworld.yaml
  # Source checkouts, checkpoints, and downloads stay here.
  weights_path: ~/.cache/reactor_registry/alayaworld
  recording:
    enabled: true
    chunk_seconds: 4
    clip_max_seconds: 300
    video_track: main_video
    video:
      codec: h264
      preset: veryfast
      crf: 23

build:
  runtime_version: "3.5.0"
  python_requirements: requirements.txt
  cuda_version: "12.8.1"
  python_version: "3.12"
  system_packages:
    - git
    - build-essential
  runtime_env:
    PYTORCH_ALLOC_CONF: expandable_segments:True
