# Reactor model specification for the AlayaWorld recipe.
$schema: reactor/v2

model:
  name: alaya-world
  version: v0.3.0
  description: |
    Play the distilled AlayaWorld model with live prompt and six-axis camera controls.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "4"
      limit: "8"
    # The checkpoint, Gemma-3-12B, and Depth-Anything-3 stage through host RAM.
    memory:
      request: 8Gi
      limit: 96Gi

runtime:
  import: alayaworld:AlayaWorld
  config: alayaworld.yaml
  # The folder that prepare_weights.py builds. Nothing downloads at runtime.
  weights_path: ./weights
  recording:
    enabled: true
    chunk_seconds: 4
    clip_max_seconds: 300
    video_track: main_video
    video:
      codec: h264
      preset: veryfast
      crf: 23

build:
  runtime_version: "3.10.0"
  python_requirements: requirements.txt
  cuda_version: "12.8.1"
  python_version: "3.12"
  system_packages:
    - git
    - build-essential
  runtime_env:
    PYTORCH_ALLOC_CONF: expandable_segments:True
    HF_HUB_OFFLINE: "1"
  # Pin the upstream sources that alayaworld.yaml's source and da3_source name.
  run:
    - >-
      git init /opt/AlayaWorld
      && git -C /opt/AlayaWorld fetch --depth 1
      https://github.com/AlayaLab/AlayaWorld.git
      1abbe2e196603ef9f8eeedfddd427b4d37d57bc1
      && git -C /opt/AlayaWorld checkout --detach FETCH_HEAD
    - >-
      git init /opt/Depth-Anything-3
      && git -C /opt/Depth-Anything-3 fetch --depth 1
      https://github.com/ByteDance-Seed/Depth-Anything-3.git
      3d835ec1a5802d64a8b8b15f817a1ab54809bfe4
      && git -C /opt/Depth-Anything-3 checkout --detach FETCH_HEAD
