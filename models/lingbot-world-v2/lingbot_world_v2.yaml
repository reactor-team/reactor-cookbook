source:
  path: lingbot-world-v2
  url: https://github.com/Robbyant/lingbot-world-v2.git
  revision: 2648877f763a06cc743bcd919936da4d25f12e7b

assets:
  checkpoint:
    path: lingbot-world-v2-14b-causal-fast
    repo_id: robbyant/lingbot-world-v2-14b-causal-fast
    revision: 5c33dd40b213598c418fd25bff30fdbd23fd38a7

inputs:
  upload_default_prompt: >-
    A photorealistic first-person scene continues naturally as the camera moves smoothly
    through the environment, preserving coherent geometry, lighting, and fine detail.
  # LingBot's released camera examples use calibration packed as [fx, fy, cx, cy].
  # Uploaded images have no calibration metadata, so they use example 03's public 480p values.
  upload_intrinsics: [415.530, 415.692, 415.778, 239.778]
  random_images:
    - name: fantasy-jungle-flight
      image: examples/00/image.jpg
      action_path: examples/00
      prompt: >-
        The video presents a soaring journey through a fantasy jungle. The wind whips past
        the rider's blue hands gripping the reins, causing the leather straps to vibrate. The
        ancient gothic castle approaches steadily, its stone details becoming clearer against
        floating islands and distant waterfalls.
    - name: stonehenge
      image: examples/01/image.jpg
      action_path: examples/01
      prompt: >-
        A slow panoramic sweep around Stonehenge on a misty, overcast day, capturing the
        ancient standing stones in serene stillness with soft ambient wind and distant birds.
    - name: city
      image: examples/02/image.jpg
      action_path: examples/02
      prompt: >-
        A cinematic first-person journey through a photorealistic urban environment in warm
        late-afternoon light, with weathered streets, industrial detail, palm trees, distant
        pedestrians, and smooth exploratory camera movement.
    - name: lake
      image: examples/03/image.jpg
      action_path: examples/03
      prompt: >-
        A serene lakeside scene with a lone tree standing in calm water, surrounded by distant
        snow-capped mountains under a bright blue sky with drifting white clouds. Gentle
        ripples reflect the tree and sky as the camera moves smoothly through the scene.
    - name: great-wall
      image: examples/04/image.jpg
      action_path: examples/04
      prompt: >-
        A sweeping cinematic journey along the Great Wall of China through golden autumn hills
        under a brilliant blue sky, with stone pathways, watchtowers, and vibrant foliage as
        the camera glides smoothly forward.
    - name: dragon-rider
      image: examples/05/image.jpg
      action_path: examples/05
      prompt: >-
        A first-person dragon rider grips leather reins while hovering above a dense fantasy
        jungle. The green-scaled dragon remains centered as held camera input explores the
        surrounding ruins, waterfalls, and distant floating islands.

inference:
  # Match the native WanI2VCausal.generate() four-step schedule and chunk size.
  seed: 42
  max_area: 399360
  chunk_latents: 4
  timesteps: [0, 250, 500, 750]
  shift: 10.0
  # The official causal-fast command uses an 18-frame rolling window with a 6-frame sink.
  local_attention_frames: 18
  attention_sink_frames: 6

stream:
  # Wan's released temporal RoPE table has 1024 positions: 256 chunks of four latents.
  max_chunks: 256

motion:
  rotation_degrees_per_second: 45.0
