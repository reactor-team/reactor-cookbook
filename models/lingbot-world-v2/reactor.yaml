$schema: reactor/v1

model:
  name: lingbot-world-v2-14b-causal-fast
  version: v0.1.0
  description: |
    Explore a causal LingBot world from an image, a prompt, and six-axis camera motion.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "8"
      limit: "16"
    memory:
      request: 32Gi
      limit: 128Gi

runtime:
  import: lingbot_world_v2:LingBotWorldV2
  config: lingbot_world_v2.yaml
  weights_path: ~/.cache/reactor_registry/lingbot-world-v2
  recording:
    enabled: true
    chunk_seconds: 4
    clip_max_seconds: 300
    video_track: main_video
    video:
      codec: h264
      preset: veryfast
      crf: 23

build:
  runtime_version: "3.2.5"
  python_requirements: requirements.txt
  cuda_version: "12.9.1"
  python_version: "3.12"
  system_packages:
    - git
  runtime_env:
    TOKENIZERS_PARALLELISM: "false"
