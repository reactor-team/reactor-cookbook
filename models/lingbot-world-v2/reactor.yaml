$schema: reactor/v2

model:
  name: lingbot-world-v2-14b-causal-fast
  version: v0.4.0
  description: |
    Explore a causal LingBot world from an image, a prompt, and six-axis camera motion.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "8"
      limit: "16"
    memory:
      request: 32Gi
      limit: 128Gi

runtime:
  import: lingbot_world_v2:LingBotWorldV2
  config: lingbot_world_v2.yaml
  # Built by prepare_weights.py; reactor run mounts it, reactor deploy --weights pushes it.
  weights_path: ./weights
  recording:
    enabled: true
    chunk_seconds: 4
    clip_max_seconds: 300
    video_track: main_video
    video:
      codec: h264
      preset: veryfast
      crf: 23

build:
  runtime_version: "3.10.0"
  python_requirements: requirements.txt
  cuda_version: "12.9.1"
  python_version: "3.12"
  system_packages:
    - git
  runtime_env:
    TOKENIZERS_PARALLELISM: "false"
    # The checkpoint comes from the weights folder; nothing downloads at runtime.
    HF_HUB_OFFLINE: "1"
  # Pin the upstream source that lingbot_world_v2.yaml's source.path names.
  run:
    - >-
      git init /opt/lingbot-world-v2
      && git -C /opt/lingbot-world-v2 fetch --depth 1
      https://github.com/Robbyant/lingbot-world-v2.git
      2648877f763a06cc743bcd919936da4d25f12e7b
      && git -C /opt/lingbot-world-v2 checkout --detach FETCH_HEAD
