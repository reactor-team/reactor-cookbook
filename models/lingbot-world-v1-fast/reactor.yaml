$schema: reactor/v2

model:
  name: lingbot-world-v1-fast-camera
  version: v0.3.0
  description: |
    Explore LingBot-World v1 Fast from an image, prompt, and six-axis camera motion.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "4"
      limit: "16"
    memory:
      request: 32Gi
      limit: 128Gi

runtime:
  import: lingbot_world_v1:LingBotWorldV1
  config: lingbot_world_v1.yaml
  # The folder that prepare_weights.py builds. Nothing downloads at runtime.
  weights_path: ./weights
  recording:
    enabled: true
    chunk_seconds: 4
    clip_max_seconds: 300
    video_track: main_video
    video:
      codec: h264
      preset: veryfast
      crf: 23

build:
  runtime_version: "3.10.0"
  python_requirements: requirements.txt
  cuda_version: "12.8.1"
  python_version: "3.12"
  run:
    - pip install --no-cache-dir --no-build-isolation flash-attn==2.8.3
    - >-
      git init /opt/lingbot-world
      && git -C /opt/lingbot-world fetch --depth 1
      https://github.com/robbyant/lingbot-world.git
      a43bec7f8091c83e9b30b16b912f6fc906236fa6
      && git -C /opt/lingbot-world checkout --detach FETCH_HEAD
  system_packages:
    - build-essential
    - git
    - libgl1
    - libglib2.0-0
  runtime_env:
    HF_HUB_OFFLINE: "1"
    TOKENIZERS_PARALLELISM: "false"
    PYTORCH_ALLOC_CONF: "expandable_segments:True"
