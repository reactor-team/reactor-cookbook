# Reactor model specification for the DIAMOND CSGO recipe.
$schema: reactor/v1

model:
  name: diamond-csgo-world-model
  version: v0.1.0
  description: |
    Play DIAMOND's Counter-Strike world model with native keyboard and mouse input.
  resources:
    # DIAMOND runs on CPU, but far below its native 15 FPS; deployed instances
    # ask for a GPU to keep the stream interactive.
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "2"
      limit: "6"
    memory:
      request: 4Gi
      limit: 16Gi

runtime:
  import: diamond:Diamond
  config: diamond.yaml
  recording:
    enabled: true
    chunk_seconds: 4
    clip_max_seconds: 300
    video_track: main_video
    video:
      codec: h264
      preset: veryfast
      crf: 23

build:
  runtime_version: "3.2.5"
  python_requirements: requirements.txt
  cuda_version: "12.8.1"
  python_version: "3.12"
  system_packages:
    - git
  runtime_env:
    DIAMOND_PATH: /opt/diamond
  # Pin the public DIAMOND source checkout the adapter imports at load.
  run:
    - >-
      git init /opt/diamond &&
      git -C /opt/diamond remote add origin https://github.com/eloialonso/diamond.git &&
      git -C /opt/diamond fetch --depth 1 origin 851cefb497733d27f1b85c804104638765860fca &&
      git -C /opt/diamond checkout --detach FETCH_HEAD &&
      rm -rf /opt/diamond/.git
