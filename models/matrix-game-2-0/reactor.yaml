$schema: reactor/v1

model:
  name: matrix-game-2-0-universal-distilled
  version: v0.1.0
  description: |
    Explore an autoregressive world from an image with composable WASD movement
    and continuous pitch and yaw camera controls.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "4"
      limit: "8"
    memory:
      request: 8Gi
      limit: 48Gi

runtime:
  import: matrix_game_2:MatrixGame2
  config: matrix_game_2.yaml
  # Source and checkpoints downloaded on first load stay here.
  weights_path: ~/.cache/reactor_registry/matrix-game-2-0
  recording:
    enabled: true
    chunk_seconds: 4
    clip_max_seconds: 300
    video_track: main_video
    video:
      codec: h264
      preset: veryfast
      crf: 23

build:
  runtime_version: "3.2.5"
  python_requirements: requirements.txt
  cuda_version: "12.8.1"
  python_version: "3.12"
  system_packages:
    - ffmpeg
    - git
    - libgl1
    - libglib2.0-0
  runtime_env:
    TOKENIZERS_PARALLELISM: "false"
