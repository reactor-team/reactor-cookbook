$schema: reactor/v2

model:
  name: matrix-game-2-0-universal-distilled
  version: v0.2.0
  description: |
    Explore an autoregressive world from an image with composable WASD movement
    and continuous pitch and yaw camera controls.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "4"
      limit: "8"
    memory:
      request: 8Gi
      limit: 48Gi

runtime:
  import: matrix_game_2:MatrixGame2
  config: matrix_game_2.yaml
  # The folder that prepare_weights.py builds. Nothing downloads at runtime.
  weights_path: ./weights
  recording:
    enabled: true
    chunk_seconds: 4
    clip_max_seconds: 300
    video_track: main_video
    video:
      codec: h264
      preset: veryfast
      crf: 23

build:
  runtime_version: "3.10.0"
  python_requirements: requirements.txt
  cuda_version: "12.8.1"
  python_version: "3.12"
  system_packages:
    - ffmpeg
    - git
    - libgl1
    - libglib2.0-0
  runtime_env:
    TOKENIZERS_PARALLELISM: "false"
    HF_HUB_OFFLINE: "1"
  # Pin the upstream source that matrix_game_2.yaml's source.path names.
  run:
    - >-
      git init /opt/Matrix-Game
      && git -C /opt/Matrix-Game sparse-checkout set Matrix-Game-2
      && git -C /opt/Matrix-Game fetch --depth 1
      https://github.com/SkyworkAI/Matrix-Game.git
      71c3cd7f741311f8100f6cf9cde942b6c1378d11
      && git -C /opt/Matrix-Game checkout --detach FETCH_HEAD
