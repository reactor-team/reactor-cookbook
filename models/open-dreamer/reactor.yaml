# Reactor model specification for the OpenDreamer recipe.
$schema: reactor/v1

model:
  name: open-dreamer
  version: v0.1.0
  description: |
    Stream an interactive Minecraft rollout initialized from a configured
    dataset demo or an uploaded screenshot and controlled with keyboard and
    mouse commands.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "2"
      limit: "6"
    memory:
      request: 8Gi
      limit: 32Gi

runtime:
  import: opendreamer:OpenDreamer
  config: opendreamer.yaml
  recording:
    enabled: true
    chunk_seconds: 4
    clip_max_seconds: 300
    video_track: main_video
    video:
      codec: h264
      preset: veryfast
      crf: 23

build:
  runtime_version: "3.2.5"
  python_requirements: requirements.txt
  python_version: "3.12"
  cuda_version: "12.9.1"
  # OpenDreamer uses JAX's CUDA wheels from PyPI.
  python_indexes:
    - https://pypi.org/simple
  system_packages:
    - ca-certificates
    - curl
    - ffmpeg
    - git
  # Expose the pinned upstream checkout to the model process.
  runtime_env:
    OPENDREAMER_PATH: /opt/open-dreamer
  # Install the pinned source and public demo assets.
  run:
    - >-
      git init /opt/open-dreamer
      && git -C /opt/open-dreamer fetch --depth 1
      https://github.com/next-state/open-dreamer.git
      797e41f052b5996740938fd2fe8161f1866de3a2
      && git -C /opt/open-dreamer checkout --detach FETCH_HEAD
    - mkdir -p /opt/open-dreamer/samples/vpt
    - >-
      curl --fail --location --retry 3
      https://openaipublic.blob.core.windows.net/minecraft-rl/data/10.0/cheeky-cornflower-setter-02e496ce4abb-20220421-092639.mp4
      --output /opt/open-dreamer/samples/vpt/cheeky-cornflower-setter-02e496ce4abb-20220421-092639.mp4
    - >-
      curl --fail --location --retry 3
      https://openaipublic.blob.core.windows.net/minecraft-rl/data/10.0/cheeky-cornflower-setter-02e496ce4abb-20220421-092639.jsonl
      --output /opt/open-dreamer/samples/vpt/cheeky-cornflower-setter-02e496ce4abb-20220421-092639.jsonl
