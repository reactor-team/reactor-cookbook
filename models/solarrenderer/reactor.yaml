$schema: reactor/v2

model:
  name: solarrenderer
  version: v0.2.0
  description: Render a structure video with an optional appearance reference and a rendering prompt.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 4
    cpu:
      request: "4"
      limit: "16"
    memory:
      request: 64Gi
      limit: 192Gi

runtime:
  import: solarrenderer:SolarRenderer
  config: solarrenderer.yaml
  weights_path: ~/.cache/reactor_registry/solarrenderer

build:
  runtime_version: "3.10.0"
  python_requirements: requirements.txt
  cuda_version: "12.8.1"
  python_version: "3.12"
  system_packages:
    - build-essential
    - git
    - libgl1
    - libglib2.0-0
  run:
    - git clone https://github.com/Enderfga/SolarRenderer.git /opt/solarrenderer && git -C /opt/solarrenderer checkout a2371eaecff9a8ab378b5ec36199c5863d138074
    - pip install --no-build-isolation flash-attn==2.8.3
    # FA2 also ships flash_attn.cute; restore the selected FA4 files last.
    - pip install --no-deps --force-reinstall flash-attn-4==4.0.0b34
    - python -c "from flash_attn.cute.interface import flash_attn_func"
  runtime_env:
    TOKENIZERS_PARALLELISM: "false"
    PYTORCH_ALLOC_CONF: "expandable_segments:True"
