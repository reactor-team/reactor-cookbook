$schema: reactor/v1

model:
  name: dreamx-world-5b
  version: v0.1.0
  description: |
    Explore an autoregressive world from an image, event prompt, and native
    composable camera controls.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "4"
      limit: "8"
    memory:
      request: 32Gi
      limit: 96Gi

runtime:
  import: dreamx_world:DreamXWorld
  config: dreamx_world.yaml
  # Source checkout, checkpoints, and downloads stay here.
  weights_path: ~/.cache/reactor_registry/dreamx-world
  recording:
    enabled: true
    chunk_seconds: 4
    clip_max_seconds: 300
    video_track: main_video
    video:
      codec: h264
      preset: veryfast
      crf: 23

build:
  runtime_version: "3.2.5"
  python_requirements: requirements.txt
  cuda_version: "12.8.1"
  python_version: "3.12"
  system_packages:
    - ca-certificates
    - git
