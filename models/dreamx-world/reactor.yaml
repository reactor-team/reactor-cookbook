$schema: reactor/v2

model:
  name: dreamx-world-5b
  version: v0.4.0
  description: |
    Explore an autoregressive world from an image, event prompt, and native
    composable camera controls.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "4"
      limit: "8"
    memory:
      request: 32Gi
      limit: 96Gi

runtime:
  import: dreamx_world:DreamXWorld
  config: dreamx_world.yaml
  # The folder that prepare_weights.py builds. Nothing downloads at runtime.
  weights_path: ./weights
  recording:
    enabled: true
    chunk_seconds: 4
    clip_max_seconds: 300
    video_track: main_video
    video:
      codec: h264
      preset: veryfast
      crf: 23

build:
  runtime_version: "3.10.0"
  python_requirements: requirements.txt
  cuda_version: "12.8.1"
  python_version: "3.12"
  system_packages:
    - ca-certificates
    - git
  runtime_env:
    HF_HUB_OFFLINE: "1"
  # Pin the upstream source that dreamx_world.yaml's source.path names.
  run:
    - >-
      git init /opt/DreamX-World
      && git -C /opt/DreamX-World fetch --depth 1
      https://github.com/AMAP-ML/DreamX-World.git
      a1f4c6e5e45600718e5236955f2e0702e53fc275
      && git -C /opt/DreamX-World checkout --detach FETCH_HEAD
