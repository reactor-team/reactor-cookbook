$schema: reactor/v1

model:
  name: hy-world-1-5
  version: v0.1.0
  description: |
    Play HY-World 1.5 with image, prompt, and native four-axis camera controls.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "4"
      limit: "8"
    memory:
      request: 16Gi
      limit: 128Gi

runtime:
  import: hy_world_1_5:HYWorld15
  config: hy_world_1_5.yaml
  weights_path: ~/.cache/reactor_registry/hy-world-1-5
  recording:
    enabled: true
    chunk_seconds: 4
    clip_max_seconds: 300
    video_track: main_video
    video:
      codec: h264
      preset: veryfast
      crf: 23

build:
  runtime_version: "3.2.5"
  python_requirements: requirements.txt
  cuda_version: "12.8.1"
  python_version: "3.12"
  system_packages:
    - git
    - libgl1
    - libglib2.0-0
  # The official CUDA wheel index also mirrors a small set of utility packages.
  # Let uv compare those entries with PyPI while resolving the environment.
  build_env:
    UV_INDEX_STRATEGY: unsafe-best-match
  runtime_env:
    TOKENIZERS_PARALLELISM: "false"
