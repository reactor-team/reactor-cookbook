# The upstream source that reactor.yaml's build.run clones into the image.
source:
  path: /opt/HY-WorldPlay
  url: https://github.com/Tencent-Hunyuan/HY-WorldPlay.git
  revision: 1588e1336e842b03b0a7860c654ebd7c46bb065e

# The pinned sources of the weights folder that prepare_weights.py builds.
# `base_model.path` is the folder the upstream pipeline loads; the encoders go
# into the subfolders of it that the pipeline reads (text_encoder/llm,
# text_encoder/byt5-small, text_encoder/Glyph-SDXL-v2, vision_encoder/siglip).
assets:
  base_model:
    path: HunyuanVideo-1.5
    repo_id: tencent/HunyuanVideo-1.5
    revision: 9b49404b3f5df2a8f0b31df27a0c7ab872e7b038
  action_model:
    path: HY-WorldPlay
    repo_id: tencent/HY-WorldPlay
    revision: f4c29235647707b571479a69b569e4166f9f5bf8
  qwen:
    repo_id: Qwen/Qwen2.5-VL-7B-Instruct
    revision: cc594898137f460bfe9f0759e9844b3ce807cfb5
  byt5:
    repo_id: google/byt5-small
    revision: 68377bdc18a2ffec8a0533fef03b1c513a4dd49d
  # Hosted on ModelScope, not Hugging Face.
  glyph:
    repo_id: AI-ModelScope/Glyph-SDXL-v2
    revision: b51a8604c03c9a4e71a389f4c7deeb526320f2e6
  # Upstream reads the SigLIP encoder of the gated FLUX.1-Redux-dev repository.
  # Its tensors are this public SO400M checkpoint's vision tower rounded to
  # bfloat16, so the weights folder holds this checkpoint and needs no token.
  vision_encoder:
    repo_id: google/siglip-so400m-patch14-384
    revision: 9fdffc58afc957d1a03a25b10dba0329ab15c2a3

inference:
  # Context-distilled autoregressive checkpoint: four denoising steps per chunk.
  steps: 4
  seed: 1

memory:
  # These are the official Reconstituted Context Memory settings. The adapter
  # validates them so interactive serving does not silently shorten memory.
  frames: 20
  temporal_context_size: 12
  stabilization_level: 15
  points_in_sphere: 50000

stream:
  max_chunks: 512
