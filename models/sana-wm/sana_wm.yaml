    model:
      repo_id: yyfz233/Pi3X
      revision: bb1deea4d7423de5b30691739cb451a3f57dc1d5

inference:
  seed: 42
  # Upstream streaming defaults. Keep these values for memory evaluation.
  num_cached_blocks: 2
  refiner_kv_max_frames: 11
  # One bounded rollout covers 12,288 generated frames (12.8 minutes at 16 FPS).
  max_chunks: 512

motion:
  # Native per-pixel-frame magnitudes from SANA-WM camera_control.py.
  translation_speed: 0.025
  rotation_speed_degrees: 0.6
  pitch_limit_degrees: 60.0

