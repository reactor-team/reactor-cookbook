$schema: reactor/v2

model:
  name: sana-wm-streaming
  version: v0.3.0
  description: |
    Explore SANA-WM's distilled autoregressive video world from an image,
    a prompt, and native camera controls.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "4"
      limit: "12"
    memory:
      request: 16Gi
      limit: 128Gi

runtime:
  import: sana_wm:SanaWM
  config: sana_wm.yaml
  # The folder that prepare_weights.py builds. Nothing downloads at runtime.
  weights_path: ./weights
  recording:
    enabled: true
    chunk_seconds: 4
    clip_max_seconds: 300
    video_track: main_video
    video:
      codec: h264
      preset: veryfast
      crf: 23

build:
  runtime_version: "3.10.0"
  python_requirements: requirements.txt
  cuda_version: "12.8.1"
  python_version: "3.12"
  system_packages:
    - build-essential
    - ffmpeg
    - git
    - libgl1
    - libglib2.0-0
  runtime_env:
    HF_HUB_OFFLINE: "1"
    PYTORCH_ALLOC_CONF: expandable_segments:True
    TOKENIZERS_PARALLELISM: "false"
  run:
    - python -m pip install --no-build-isolation mmcv==1.7.2
    # Pin the upstream sources that sana_wm.yaml's source paths name.
    - >-
      git init /opt/SANA
      && git -C /opt/SANA fetch --depth 1
      https://github.com/NVlabs/SANA.git
      5498e5b2070ef8c808ee7eab7f7c7707b53cd8ea
      && git -C /opt/SANA checkout --detach FETCH_HEAD
    - >-
      git init /opt/Pi3
      && git -C /opt/Pi3 fetch --depth 1
      https://github.com/yyfz/Pi3.git
      9fa3ddb3f8d53041f8b2738df404f62223bbaa7b
      && git -C /opt/Pi3 checkout --detach FETCH_HEAD
