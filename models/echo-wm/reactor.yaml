# Reactor model specification for the Echo-WM Flash recipe.
$schema: reactor/v2

model:
  name: echo-wm-flash
  version: v0.3.0
  description: |
    Explore an autoregressive audiovisual world from an image, a prompt, and
    Echo-WM's native pure-camera controls.
  resources:
    gpu:
      type: NVIDIA_B200
      count: 1
    cpu:
      request: "8"
      limit: "16"
    memory:
      request: 64Gi
      limit: 160Gi

runtime:
  import: echo_wm:EchoWM
  config: echo_wm.yaml
  # One step's frames go back in one data-channel message; a native step is
  # larger than the default 64 MiB.
  webrtc:
    max_message_size: 256Mi
  # The folder that prepare_weights.py builds. Nothing downloads at runtime.
  weights_path: ./weights
  recording:
    enabled: true
    chunk_seconds: 4
    clip_max_seconds: 300
    video_track: main_video
    audio_track: main_audio
    video:
      codec: h264
      preset: veryfast
      crf: 23
    audio:
      codec: aac
      bitrate_kbps: 192

build:
  runtime_version: "3.11.3"
  python_requirements: requirements.txt
  cuda_version: "12.8.1"
  python_version: "3.12"
  system_packages:
    - build-essential
    - ffmpeg
    - git
    - libgl1
    - libglib2.0-0
    - libsndfile1
  runtime_env:
    PYTORCH_ALLOC_CONF: expandable_segments:True
    HF_HUB_OFFLINE: "1"
  run:
    # Pin the upstream source that echo_wm.yaml's source.path names.
    - >-
      git init /opt/JoyAI-Echo
      && git -C /opt/JoyAI-Echo fetch --depth 1
      https://github.com/jd-opensource/JoyAI-Echo.git
      c7963031c4425a154a791a46606d3247b2201c2b
      && git -C /opt/JoyAI-Echo checkout --detach FETCH_HEAD
    - pip install --no-cache-dir "flash-attn-4==4.0.0b26"
    # CuTe declares protobuf<7, while Reactor Runtime requires protobuf>=7.35.1.
    # Both execute with 7.35.1, so restore Runtime's supported wire dependency.
    - pip install --no-cache-dir --no-deps "protobuf==7.35.1"
