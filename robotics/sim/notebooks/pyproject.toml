[project]
name = "reactor-robotics-notebooks"
version = "0.1.0"
description = "Quickstart scripts + minimal clients for Reactor-served robotics policies (xwam, lingbot-va, groot-n17, cosmos-nano-policy-droid, dreamzero, xr1-robocasa365)"
requires-python = ">=3.10"

dependencies = [
    "reactor-sdk==1.6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
i2rt = ["opencv-python>=4.10"]

# No simulator dependency. Every script replays recorded observations against
# the hosted model, so it needs no sim, no GPU and no model weights. The
# optional full-simulator section at the bottom of each guide runs that
# model's own benchmark in its own environment. For five of the six the
# harness is in this repo (../libero/, ../cosmos-droid/,
# ../robotwin/, ../dreamzero/, ../robocasa365/).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reactor_robotics*"]
