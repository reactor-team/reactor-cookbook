[project]
name = "robotwin-sim"
version = "0.1.0"
description = "Minimal RoboTwin 2.0 gateway example: the authors' evaluation client, unmodified, against a Reactor-served xwam"
requires-python = ">=3.10"

dependencies = [
    "reactor-sdk==1.6.0",
    "numpy>=1.26",
    # The authors' client speaks pickle over zmq; this is the other end.
    "pyzmq>=25.0",
]

# RoboTwin 2.0 / SAPIEN is NOT a dependency: the authors' evaluation stack
# runs unmodified in its own virtualenv with its own numpy, and connects to
# this process over a local port. See README.md "Running an evaluation".

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["robotwin_sim*"]
