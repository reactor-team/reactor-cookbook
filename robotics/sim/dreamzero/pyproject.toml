[project]
name = "dreamzero-sim"
version = "0.1.0"
description = "Minimal RoboLab gateway example: Isaac Sim's DROID benchmark driven by a Reactor-served dreamzero"
requires-python = ">=3.10"

dependencies = [
    # Native publisher API; keep aligned with notebooks/pyproject.toml.
    "reactor-sdk>=1.8.0,<2",
    "numpy>=1.26",
    # The openpi msgpack-WebSocket protocol RoboLab's own client speaks.
    # The server itself is in this package rather than taken as a dependency;
    # see README.md "Why the protocol server is in this package".
    "websockets>=12.0",
    "msgpack>=1.0",
]

# RoboLab / Isaac Sim is NOT a dependency: it runs unmodified in its own
# container with its own python, and connects to this process over a socket.
# See README.md "Run RoboLab against Reactor".

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dreamzero_sim*"]
