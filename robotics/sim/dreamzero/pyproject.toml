[project]
name = "dreamzero-sim"
version = "0.1.0"
description = "Minimal RoboLab gateway example: Isaac Sim's DROID benchmark driven by a Reactor-served dreamzero"
requires-python = ">=3.10"

dependencies = [
    # Pinned exactly, matching notebooks/pyproject.toml. 0.8.0 is the version
    # this path was verified against, and the bridge works around a specific
    # gap in it (no client keepalive, so it pings on its own; see
    # bridge.py). The three older examples in this repo floor at >=0.2.2;
    # this one needs 0.8.0's API, in particular the runtime-scoped ping.
    "reactor-sdk==0.8.0",
    "aiortc>=1.9",
    "av>=12.0",
    "numpy>=1.26",
    # The openpi msgpack-WebSocket protocol RoboLab's own client speaks.
    # The server itself is in this package rather than taken as a dependency;
    # see README.md "Why the protocol server is in this package".
    "websockets>=12.0",
    "msgpack>=1.0",
]

# RoboLab / Isaac Sim is NOT a dependency: it runs unmodified in its own
# container with its own python, and connects to this process over a socket.
# See README.md "Run RoboLab against Reactor".

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dreamzero_sim*"]
